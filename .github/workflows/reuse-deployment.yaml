name: Solar-system Deployment reusable workflow

on:
    workflow_call: 
      secrets:
        k8s-kubeconfig:
            required: true
        mongodb-password:
            required: true
      inputs:
        mongodb-uri:
            required: true
            type: string
        kubectl-version:
            required: false
            type: string
            description: Provide the required kubectl version
            default: v1.34.0
        k8s-manifest-dir:
            required: true
            default: kubernetes/
            type: string
            description: Directory containing manifest file
        environment:
            required: true
            type: string
            default: dev
            description: Provide the deployment environment
jobs:
    reuse-deploy:
        runs-on: ubuntu-latest
        environment:
          name: ${{ inputs.environment }}
          url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
        outputs: 
          APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
    
            - name: Install kubectl CLI
              uses: azure/setup-kubectl@v4
              with:
                version: ${{ inputs.kubectl-version }}
              id: install
    
            - uses: azure/k8s-set-context@v4
              with:
                 method: kubeconfig
                 kubeconfig: ${{ secrets.k8s-kubeconfig }} 
    
    
            - name: Fetch Kubernetes Cluster details
              run: |
                kubectl version
                echo --------------------------------
                kubectl get nodes
                kubectl get pods
    
            - name: Replace tokens in manifest file
              uses: cschleiden/replace-tokens@v1
              with:
                tokenPrefix: '__'
                tokenSuffix: '__'
                files: '["${{ inputs.k8s-manifest-dir }}/*.yaml"]'
              env:
                NAMESPACE: ${{ vars.NAMESPACE }}
                REPLICAS: ${{ vars.REPLICAS }}
                IMAGE: kloude/node-test:${{ github.sha}}
    
            - name: Show replaced files
              run: |
                cat ${{ inputs.k8s-manifest-dir }}/*.yaml
    
    
            - name: Create mongodb Secret
              run: |
                kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
                --from-literal=MONGO_URI=${{ inputs.mongodb-uri }} \
                --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
                --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
                --save-config \
                --dry-run=client \
                -o yaml | kubectl apply -f -
    
            - name: Dev Deployment
              run: |
                kubectl apply -f  ${{ inputs.k8s-manifest-dir }}
    
            - name: Set App ingress HOST Url
              id: set-ingress-host-address
              run: |
                echo "APP_INGRESS_HOST=$(kubectl get httproute solar-system-route -n default -o jsonpath='{.spec.hostnames[0]}')" >> "$GITHUB_OUTPUT"
                echo "APP_INGRESS_HOST"
    
   